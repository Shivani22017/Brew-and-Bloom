<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew & Bloom | Contact & Reviews</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact-review.css">
    <link rel="stylesheet" href="advanced.css">
</head>
<body class="contact-page">
    <section>
        <nav>
            <a href="index.html"><img src="images/Brews-Blooms.jpg" alt="Brew & Bloom logo"></a>
            <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
            <div class="nav-links">
                <ul>
                    <li><a href="index.html"><b>Home</b></a></li>
                    <li><a href="about.html"><b>About</b></a></li>
                    <li><a href="menu.html"><b>Menu</b></a></li>
                    <li><a href="order.html"><b>Order</b><span class="cart-count" hidden>0</span></a></li>
                    <li><a href="book.html"><b>Book</b></a></li>
                    <li><a href="contact.html"><b>Contact Us</b></a></li>
                </ul>
            </div>
        </nav>
    </section>
    <div class="container">
        <h1>Brew &amp; Bloom Cafe</h1>

        <!-- Contact Us Section -->
        <section class="card">
            <h2>Contact Us</h2>
            <p>📍 Brew &amp; Bloom Cafe, Cozy Street, Your City</p>
            <p>📞 +91 9XXXXXXXXX</p>
            <p>📧 brewandbloom@gmail.com</p>
        </section>

        <!-- Customer Reviews Section -->
        <section class="card">
            <h2>Customer Reviews</h2>
            <p class="rating-summary" id="ratingSummary"></p>
            <div id="reviewList"></div>
        </section>

        <!-- Add a review -->
        <section class="card">
            <h2>Write a Review</h2>
            <form id="reviewForm" class="review-form" novalidate>
                <div id="formMsg" class="form-msg" role="alert" hidden></div>
                <input type="text" id="rName" placeholder="Your Name" maxlength="30" required>
                <div class="star-input" role="radiogroup" aria-label="Rating">
                    <input type="radio" name="rating" id="s5" value="5"><label for="s5" title="5 stars">★</label>
                    <input type="radio" name="rating" id="s4" value="4"><label for="s4" title="4 stars">★</label>
                    <input type="radio" name="rating" id="s3" value="3"><label for="s3" title="3 stars">★</label>
                    <input type="radio" name="rating" id="s2" value="2"><label for="s2" title="2 stars">★</label>
                    <input type="radio" name="rating" id="s1" value="1"><label for="s1" title="1 star">★</label>
                </div>
                <textarea id="rText" placeholder="Share your experience (min 10 characters)" maxlength="160" required></textarea>
                <button type="submit">Submit Review</button>
            </form>
        </section>
    </div>
    <footer id="footer"><p>&copy; 2025 Brew &amp; Bloom Cafe | All Rights Reserved | <a class="admin-link" href="admin.html">Owner Dashboard</a></p></footer>
    <script src="js/data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
